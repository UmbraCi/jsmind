<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <title>jsMind</title>
        <link type="text/css" rel="stylesheet" href="../style/jsmind.css" />
        <style type="text/css">
            #jsmind_container {
                width: 800px;
                height: 500px;
                border: solid 1px #ccc;
                /*background:#f4f4f4;*/
                background: #f4f4f4;
            }
        </style>
    </head>
    <body>
        <input type="file" onchange="load_file(this);" />
        <button onclick="save_nodetree();">nodetree</button>
        <button onclick="replay();">replay</button>
        <button
            onclick="switch_mindmap();"
            style="background-color: #4caf50; color: white; font-weight: bold"
        >
            切换脑图
        </button>
        <div id="jsmind_container"></div>
        <div style="margin: 8px 0; color: #666; font-size: 14px">
            💡 提示：选中任意节点后按 <kbd>Tab</kbd> 键可以快速添加子节点并进入编辑模式
        </div>
        <div id="history_controls" style="margin: 8px 0">
            <button id="btn_undo" onclick="h_undo()">Undo</button>
            <button id="btn_redo" onclick="h_redo()">Redo</button>
            <button onclick="h_add()">Add Snapshot</button>
            <button onclick="h_snapA()">Set A</button>
            <button onclick="h_snapB()">Set B</button>
            <button onclick="h_diff()">Diff A→B</button>
            <button onclick="h_diff_ignore_shift()" style="background-color: #ff9800; color: white">
                Diff (Ignore Shift)
            </button>
            <button onclick="h_info()">Stack Info</button>
            <button
                onclick="test_fieldnames_diff_step1()"
                style="background-color: #4caf50; color: white"
            >
                Test FieldNames Diff (Step 1)
            </button>
            <button
                onclick="test_fieldnames_diff_step2()"
                style="background-color: #2196f3; color: white"
            >
                Test FieldNames Diff (Step 2)
            </button>
            <span id="history_status" style="margin-left: 10px; color: #666"></span>
        </div>

        <script type="text/javascript" src="../dist/jsmind.js"></script>
        <script type="text/javascript" src="../dist/jsmind.draggable-node.js"></script>
        <script type="text/javascript" src="../dist/jsmind.multiline-text.js"></script>
        <!-- 新增：历史记录插件（UMD 构建） -->
        <script type="text/javascript" src="../dist/jsmind.history.js"></script>
        <script type="text/javascript" src="../features/jsmind.shell.js"></script>
        <script type="text/javascript">
            var _jm = null;
            function load_jsmind() {
                var mind = {
                    meta: {
                        name: 'demo',
                        author: 'hizzgdev@163.com',
                        version: '0.2',
                    },
                    format: 'node_array',
                    data: [
                        { id: 'root', isroot: true, name: 'jsMind\n多行文本支持' },

                        {
                            id: 'sub1',
                            parentid: 'root',
                            name: '功能特性\n- 多行编辑\n- 自动换行\n- 拖拽支持',
                        },
                        { id: 'sub11', parentid: 'sub1', name: '编辑方式\nCtrl+Enter 完成编辑' },
                        {
                            id: 'sub12',
                            parentid: 'sub1',
                            name: '文本换行\n支持长文本自动换行显示',
                        },
                        { id: 'sub13', parentid: 'sub1', name: '样式支持\n可自定义宽度和高度' },

                        { id: 'sub2', parentid: 'root', name: '使用说明\n双击节点开始编辑' },
                        {
                            id: 'sub21',
                            parentid: 'sub2',
                            name: '快捷键\nEsc: 取消编辑\nCtrl+Enter: 完成编辑\nTab: 添加子节点',
                        },
                        {
                            id: 'sub22',
                            parentid: 'sub2',
                            name: '拖拽功能\n可以拖拽节点到其他位置',
                        },

                        {
                            id: 'sub3',
                            parentid: 'root',
                            name: '技术实现\n基于 contenteditable\n支持 HTML 内容',
                            draggable: false,
                        },
                    ],
                };
                // 注册增强插件：历史记录（启用撤销/重做快捷键）
                // 兼容 UMD 命名/导出方式：优先使用命名导出 HistoryPlugin，其次 default，最后整个对象本身
                jsMind.usePlugin(
                    jsMindHistory.HistoryPlugin || jsMindHistory.default || jsMindHistory,
                    { keymap: { enabled: true, redoUsesY: false } }
                );

                var options = {
                    container: 'jsmind_container',
                    editable: true,
                    theme: 'primary',
                    log_level: 'debug',
                    // 使用 fieldNames 配置，将 topic 映射为 name
                    fieldNames: {
                        topic: 'name',
                    },
                    shortcut: {
                        handles: {
                            test: function (j, e) {
                                console.log(j);
                            },
                            add_child: function (j, e) {
                                // 获取当前选中的节点
                                var selected_node = j.get_selected_node();
                                if (!selected_node) {
                                    // 如果没有选中节点，选中根节点
                                    selected_node = j.get_root();
                                }

                                if (selected_node) {
                                    // 生成唯一的节点ID
                                    var node_id =
                                        'node_' +
                                        Date.now() +
                                        '_' +
                                        Math.random().toString(36).substr(2, 9);
                                    var topic = '新节点';

                                    // 添加子节点
                                    j.add_node(selected_node, node_id, topic);
                                    // 选中新创建的节点并开始编辑
                                    j.select_node(node_id);
                                    j.begin_edit(node_id);
                                }
                            },
                        },
                        mapping: {
                            test: 89, // Y key
                            add_child: 9, // Tab key
                        },
                    },
                    view: {
                        engine: 'svg',
                        expander_style: 'char',
                    },
                    // 配置插件选项
                    plugins: ['draggable-node'],
                    plugin: {
                        draggable_node: {
                            validate_drag: function (draggedNode, targetNode) {
                                // 示例：禁止将节点拖拽到根节点
                                if (targetNode.isroot) {
                                    alert('❌ 不能将节点拖拽到根节点！');
                                    return false;
                                }

                                // 示例：禁止将标记为不可拖拽的节点拖拽
                                if (draggedNode.data && draggedNode.data.draggable === false) {
                                    alert('❌ 此节点不能拖拽！');
                                    return false;
                                }

                                return true; // 允许拖拽
                            },
                        },
                    },
                };
                _jm = new jsMind(options);
                _jm.show(mind);

                console.log(
                    '%c拖拽验证功能示例',
                    'color: #4caf50; font-size: 14px; font-weight: bold;'
                );
                console.log('尝试拖拽节点，体验验证功能：');
                console.log('- 将子节点拖拽到根节点 → 会被阻止');
                console.log('- 拖拽"技术实现"节点 → 会被阻止（已标记为不可拖拽）');

                // 监听历史栈状态变化事件，自动更新按钮状态
                _jm.add_event_listener(function (type, data) {
                    if (type === jsMind.event_type.history_change) {
                        // 更新 Undo/Redo 按钮状态
                        var btnUndo = document.getElementById('btn_undo');
                        var btnRedo = document.getElementById('btn_redo');
                        var statusSpan = document.getElementById('history_status');

                        if (btnUndo) btnUndo.disabled = !data.canBack;
                        if (btnRedo) btnRedo.disabled = !data.canForward;
                        if (statusSpan) {
                            statusSpan.textContent =
                                'History: ' + (data.index + 1) + ' / ' + data.length;
                        }

                        console.log('[history_change]', data);
                    }
                });

                // jm.set_readonly(true);
                // var mind_data = jm.get_data();
                // alert(mind_data);
            }

            function load_file(fi) {
                var files = fi.files;
                if (files.length > 0) {
                    var file_data = files[0];
                    jsMind.util.file.read(file_data, function (freemind_data, jsmind_name) {
                        var mind = jsmind_data;
                        if (!!mind) {
                            _jm.show(mind);
                        } else {
                            console.error('can not open this file as mindmap');
                        }
                    });
                }
            }

            function save_nodetree() {
                var mind_data = _jm.get_data('node_tree');
                console.log(mind_data);
            }

            function replay() {
                var shell = _jm.shell;
                if (!!shell) {
                    shell.replay();
                }
            }

            // ----- History demo helpers (top-level) -----
            var snapA = null,
                snapB = null;
            function h_undo() {
                if (_jm && _jm.history) {
                    var ok = _jm.history.back();
                    console.log('undo', ok, 'index/len', _jm.history.index(), _jm.history.length());
                }
            }
            function h_redo() {
                if (_jm && _jm.history) {
                    var ok = _jm.history.forward();
                    console.log('redo', ok, 'index/len', _jm.history.index(), _jm.history.length());
                }
            }
            function h_add() {
                if (_jm && _jm.history) {
                    _jm.history.add('manual-click');
                    console.log(
                        'add snapshot, index/len',
                        _jm.history.index(),
                        _jm.history.length()
                    );
                }
            }
            function h_snapA() {
                if (_jm && _jm.history) {
                    snapA = _jm.history.exportSnapshot();
                    console.log('Snapshot A set:', snapA);
                }
            }
            function h_snapB() {
                if (_jm && _jm.history) {
                    snapB = _jm.history.exportSnapshot();
                    console.log('Snapshot B set:', snapB);
                }
            }
            function h_diff() {
                if (!snapA || !snapB) {
                    alert('请先点击 Set A / Set B');
                    return;
                }

                // Test 1: Auto-detect fieldNames (recommended)
                console.log('=== Test 1: Auto-detect fieldNames ===');
                var d1 = _jm.history.diff(snapA, snapB);
                console.log('Diff A→B (auto):', d1);

                // Test 2: Manual fields (should override auto-detection)
                console.log('=== Test 2: Manual fields override ===');
                var d2 = _jm.history.diff(snapA, snapB, { fields: ['name', 'data', 'id'] });
                console.log('Diff A→B (manual):', d2);

                // Test 3: Wrong fields (should miss changes)
                console.log('=== Test 3: Wrong fields (should miss changes) ===');
                var d3 = _jm.history.diff(snapA, snapB, { fields: ['topic', 'data', 'id'] });
                console.log('Diff A→B (wrong):', d3);

                // Display results
                var msg =
                    'Test 1 (auto): created=' +
                    d1.created.length +
                    ', updated=' +
                    d1.updated.length +
                    ', deleted=' +
                    d1.deleted.length +
                    '\n';
                msg +=
                    'Test 2 (manual): created=' +
                    d2.created.length +
                    ', updated=' +
                    d2.updated.length +
                    ', deleted=' +
                    d2.deleted.length +
                    '\n';
                msg +=
                    'Test 3 (wrong): created=' +
                    d3.created.length +
                    ', updated=' +
                    d3.updated.length +
                    ', deleted=' +
                    d3.deleted.length +
                    '\n';
                msg += '\n详细信息请查看控制台';
                alert(msg);
            }
            function h_diff_ignore_shift() {
                if (!snapA || !snapB) {
                    alert('请先点击 Set A / Set B');
                    return;
                }

                // Test with ignoreDeletionShift: false (default)
                console.log('=== Default Behavior (ignoreDeletionShift: false) ===');
                var d1 = _jm.history.diff(snapA, snapB, { categorize: true });
                console.log('Diff with default behavior:', d1);

                // Test with ignoreDeletionShift: true
                console.log('=== With ignoreDeletionShift: true ===');
                var d2 = _jm.history.diff(snapA, snapB, {
                    categorize: true,
                    ignoreDeletionShift: true,
                });
                console.log('Diff with ignoreDeletionShift:', d2);

                // Compare results
                var msg =
                    '默认行为: moved=' +
                    (d1.moved ? d1.moved.length : 0) +
                    ', modified=' +
                    (d1.modified ? d1.modified.length : 0) +
                    '\n';
                msg +=
                    'Ignore Shift: moved=' +
                    (d2.moved ? d2.moved.length : 0) +
                    ', modified=' +
                    (d2.modified ? d2.modified.length : 0) +
                    '\n';
                msg +=
                    '\n如果删除了节点，ignoreDeletionShift 会减少因删除导致的误判\n详细信息请查看控制台';
                alert(msg);
            }
            function h_info() {
                if (_jm && _jm.history) {
                    var m = _jm.history.getStack();
                    console.log('Stack meta', m);
                    alert('index/length = ' + _jm.history.index() + '/' + _jm.history.length());
                }
            }

            // Test fieldNames diff functionality
            // Step 1: Take snapshot before modification
            var _test_snapshot_before = null;
            function test_fieldnames_diff_step1() {
                if (!_jm || !_jm.history) {
                    alert('History plugin not available');
                    return;
                }

                _test_snapshot_before = _jm.get_data('node_tree');
                console.log('=== FieldNames Diff Test - Step 1 ===');
                console.log('Configured fieldNames:', _jm.options.fieldNames);
                console.log('Before snapshot taken:', _test_snapshot_before);

                alert(
                    '✅ Step 1 完成!\n\n快照已保存。\n\n请手动修改任意节点的文本,然后点击 "Test FieldNames Diff (Step 2)" 按钮。'
                );
            }

            // Step 2: Take snapshot after modification and compare
            function test_fieldnames_diff_step2() {
                if (!_jm || !_jm.history) {
                    alert('History plugin not available');
                    return;
                }

                if (!_test_snapshot_before) {
                    alert('❌ 错误!\n\n请先点击 "Test FieldNames Diff (Step 1)" 按钮保存快照。');
                    return;
                }

                // Get after snapshot
                var after = _jm.get_data('node_tree');
                console.log('=== FieldNames Diff Test - Step 2 ===');
                console.log('After snapshot:', after);

                // Test diff with auto-detection
                var diff = _jm.history.diff(_test_snapshot_before, after);
                console.log('Diff result:', diff);

                // Verify the diff detected the change
                var success = false;
                var detectedField = null;
                var changeDetails = [];

                if (diff.updated && diff.updated.length > 0) {
                    for (var i = 0; i < diff.updated.length; i++) {
                        var update = diff.updated[i];
                        console.log('Updated node ' + (i + 1) + ':', update);
                        console.log('Changes:', update.changes);

                        // Check if 'name' field change was detected
                        for (var j = 0; j < update.changes.length; j++) {
                            var change = update.changes[j];
                            if (change.key === 'name') {
                                success = true;
                                detectedField = 'name';
                                changeDetails.push({
                                    nodeId: update.id,
                                    before: change.before,
                                    after: change.after,
                                });
                            }
                        }
                    }
                }

                // Display result
                var msg = '=== FieldNames Diff Test Result ===\n\n';
                msg += 'Configured fieldNames.topic: "name"\n';
                msg += 'Updates detected: ' + (diff.updated ? diff.updated.length : 0) + '\n';
                if (success) {
                    msg +=
                        '✅ SUCCESS: Diff correctly detected change in "' +
                        detectedField +
                        '" field!\n\n';
                    msg += 'Changes:\n';
                    for (var k = 0; k < changeDetails.length; k++) {
                        var detail = changeDetails[k];
                        msg += '- Node ' + detail.nodeId + ':\n';
                        msg += '  Before: "' + detail.before + '"\n';
                        msg += '  After: "' + detail.after + '"\n';
                    }
                } else {
                    msg += '❌ FAILED: Diff did not detect change in "name" field\n';
                    if (diff.updated && diff.updated.length > 0) {
                        var fields = diff.updated[0].changes
                            .map(function (c) {
                                return c.key;
                            })
                            .join(', ');
                        msg += 'Changes detected in fields: ' + fields;
                    } else {
                        msg += 'No changes detected. Did you modify any node?';
                    }
                }
                msg += '\n\n详细信息请查看控制台';
                alert(msg);

                // Reset snapshot
                _test_snapshot_before = null;
            }

            // ----- Switch mindmap demo -----
            var currentMindIndex = 0;
            var mindmaps = [
                // 第一个脑图（默认）
                {
                    meta: {
                        name: 'demo',
                        author: 'hizzgdev@163.com',
                        version: '0.2',
                    },
                    format: 'node_array',
                    data: [
                        { id: 'root', isroot: true, name: 'jsMind\n多行文本支持' },
                        {
                            id: 'sub1',
                            parentid: 'root',
                            name: '功能特性\n- 多行编辑\n- 自动换行\n- 拖拽支持',
                        },
                        { id: 'sub11', parentid: 'sub1', name: '编辑方式\nCtrl+Enter 完成编辑' },
                        {
                            id: 'sub12',
                            parentid: 'sub1',
                            name: '文本换行\n支持长文本自动换行显示',
                        },
                        { id: 'sub13', parentid: 'sub1', name: '样式支持\n可自定义宽度和高度' },
                        { id: 'sub2', parentid: 'root', name: '使用说明\n双击节点开始编辑' },
                        {
                            id: 'sub21',
                            parentid: 'sub2',
                            name: '快捷键\nEsc: 取消编辑\nCtrl+Enter: 完成编辑\nTab: 添加子节点',
                        },
                        {
                            id: 'sub22',
                            parentid: 'sub2',
                            name: '拖拽功能\n可以拖拽节点到其他位置',
                        },
                        {
                            id: 'sub3',
                            parentid: 'root',
                            name: '技术实现\n基于 contenteditable\n支持 HTML 内容',
                            draggable: false,
                        },
                    ],
                },
                // 第二个脑图
                {
                    meta: {
                        name: 'project-plan',
                        author: 'demo',
                        version: '1.0',
                    },
                    format: 'node_array',
                    data: [
                        { id: 'root2', isroot: true, name: '项目计划' },
                        { id: 'phase1', parentid: 'root2', name: '第一阶段：需求分析' },
                        { id: 'phase1-1', parentid: 'phase1', name: '用户调研' },
                        { id: 'phase1-2', parentid: 'phase1', name: '需求文档' },
                        { id: 'phase2', parentid: 'root2', name: '第二阶段：设计开发' },
                        { id: 'phase2-1', parentid: 'phase2', name: 'UI 设计' },
                        { id: 'phase2-2', parentid: 'phase2', name: '前端开发' },
                        { id: 'phase2-3', parentid: 'phase2', name: '后端开发' },
                        { id: 'phase3', parentid: 'root2', name: '第三阶段：测试上线' },
                        { id: 'phase3-1', parentid: 'phase3', name: '功能测试' },
                        { id: 'phase3-2', parentid: 'phase3', name: '性能优化' },
                        { id: 'phase3-3', parentid: 'phase3', name: '正式上线' },
                    ],
                },
                // 第三个脑图
                {
                    meta: {
                        name: 'learning-path',
                        author: 'demo',
                        version: '1.0',
                    },
                    format: 'node_array',
                    data: [
                        { id: 'root3', isroot: true, name: '前端学习路线' },
                        { id: 'basic', parentid: 'root3', name: '基础知识' },
                        { id: 'basic-1', parentid: 'basic', name: 'HTML' },
                        { id: 'basic-2', parentid: 'basic', name: 'CSS' },
                        { id: 'basic-3', parentid: 'basic', name: 'JavaScript' },
                        { id: 'framework', parentid: 'root3', name: '框架学习' },
                        { id: 'framework-1', parentid: 'framework', name: 'React' },
                        { id: 'framework-2', parentid: 'framework', name: 'Vue' },
                        { id: 'framework-3', parentid: 'framework', name: 'Angular' },
                        { id: 'advanced', parentid: 'root3', name: '进阶技能' },
                        { id: 'advanced-1', parentid: 'advanced', name: 'TypeScript' },
                        { id: 'advanced-2', parentid: 'advanced', name: 'Webpack' },
                        { id: 'advanced-3', parentid: 'advanced', name: '性能优化' },
                    ],
                },
            ];

            function switch_mindmap() {
                if (!_jm) {
                    alert('jsMind 未初始化');
                    return;
                }

                // 切换到下一个脑图
                currentMindIndex = (currentMindIndex + 1) % mindmaps.length;
                var nextMind = mindmaps[currentMindIndex];

                console.log('切换到脑图 ' + (currentMindIndex + 1) + ':', nextMind.meta.name);
                console.log(
                    '切换前历史栈状态:',
                    _jm.history
                        ? 'index=' + _jm.history.index() + ', length=' + _jm.history.length()
                        : 'N/A'
                );

                // 调用 show 方法切换脑图
                _jm.show(nextMind);

                // 延迟检查历史栈状态（等待 history 插件初始化完成）
                // 延迟时间需要大于 history 插件的 setTimeout 延迟（100ms）
                setTimeout(function () {
                    console.log(
                        '切换后历史栈状态:',
                        _jm.history
                            ? 'index=' + _jm.history.index() + ', length=' + _jm.history.length()
                            : 'N/A'
                    );
                    var expectedState = 'History: 1 / 1';
                    var actualState =
                        'History: ' + (_jm.history.index() + 1) + ' / ' + _jm.history.length();
                    if (actualState === expectedState) {
                        alert(
                            '✅ 切换成功！\n脑图: ' +
                                nextMind.meta.name +
                                '\n历史栈状态: ' +
                                actualState
                        );
                    } else {
                        alert(
                            '⚠️ 切换成功，但历史栈状态异常！\n脑图: ' +
                                nextMind.meta.name +
                                '\n期望状态: ' +
                                expectedState +
                                '\n实际状态: ' +
                                actualState
                        );
                    }
                }, 150); // 延迟 150ms，确保 history 插件的 setTimeout(100ms) 已执行
            }

            load_jsmind();
        </script>
    </body>
</html>
