<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <title>jsMind</title>
        <link type="text/css" rel="stylesheet" href="../style/jsmind.css" />
        <style type="text/css">
            #jsmind_container {
                width: 800px;
                height: 500px;
                border: solid 1px #ccc;
                /*background:#f4f4f4;*/
                background: #f4f4f4;
            }
        </style>
    </head>
    <body>
        <input type="file" onchange="load_file(this);" />
        <button onclick="save_nodetree();">nodetree</button>
        <button onclick="replay();">replay</button>
        <div id="jsmind_container"></div>
        <div id="history_controls" style="margin: 8px 0;">
            <button onclick="h_undo()">Undo</button>
            <button onclick="h_redo()">Redo</button>
            <button onclick="h_add()">Add Snapshot</button>
            <button onclick="h_snapA()">Set A</button>
            <button onclick="h_snapB()">Set B</button>
            <button onclick="h_diff()">Diff A→B</button>
            <button onclick="h_info()">Stack Info</button>
        </div>

        <script type="text/javascript" src="../dist/jsmind.js"></script>
        <script type="text/javascript" src="../dist/jsmind.draggable-node.js"></script>
        <script type="text/javascript" src="../dist/jsmind.multiline-text.js"></script>
        <!-- 新增：历史记录插件（UMD 构建） -->
        <script type="text/javascript" src="../dist/jsmind.history.js"></script>
        <script type="text/javascript" src="../features/jsmind.shell.js"></script>
        <script type="text/javascript">
            var _jm = null;
            function load_jsmind() {
                var mind = {
                    meta: {
                        name: 'demo',
                        author: 'hizzgdev@163.com',
                        version: '0.2',
                    },
                    format: 'node_array',
                    data: [
                        { id: 'root', isroot: true, topic: 'jsMind\n多行文本支持' },

                        {
                            id: 'sub1',
                            parentid: 'root',
                            topic: '功能特性\n- 多行编辑\n- 自动换行\n- 拖拽支持',
                        },
                        { id: 'sub11', parentid: 'sub1', topic: '编辑方式\nCtrl+Enter 完成编辑' },
                        {
                            id: 'sub12',
                            parentid: 'sub1',
                            topic: '文本换行\n支持长文本自动换行显示',
                        },
                        { id: 'sub13', parentid: 'sub1', topic: '样式支持\n可自定义宽度和高度' },

                        { id: 'sub2', parentid: 'root', topic: '使用说明\n双击节点开始编辑' },
                        {
                            id: 'sub21',
                            parentid: 'sub2',
                            topic: '快捷键\nEsc: 取消编辑\nCtrl+Enter: 完成编辑',
                        },
                        {
                            id: 'sub22',
                            parentid: 'sub2',
                            topic: '拖拽功能\n可以拖拽节点到其他位置',
                        },

                        {
                            id: 'sub3',
                            parentid: 'root',
                            topic: '技术实现\n基于 contenteditable\n支持 HTML 内容',
                        },
                    ],
                };
                // 注册增强插件：历史记录（启用撤销/重做快捷键）
                // 兼容 UMD 命名/导出方式：优先使用命名导出 HistoryPlugin，其次 default，最后整个对象本身
                jsMind.usePlugin(
                    jsMindHistory.HistoryPlugin || jsMindHistory.default || jsMindHistory,
                    { keymap: { enabled: true, redoUsesY: false } }
                );

                var options = {
                    container: 'jsmind_container',
                    editable: true,
                    theme: 'primary',
                    log_level: 'debug',
                    shortcut: {
                        handles: {
                            test: function (j, e) {
                                console.log(j);
                            },
                        },
                        mapping: {
                            test: 89,
                        },
                    },
                    view: {
                        engine: 'svg',
                        expander_style: 'char',
                    },
                };
                _jm = new jsMind(options);
                _jm.show(mind);
                // jm.set_readonly(true);
                // var mind_data = jm.get_data();
                // alert(mind_data);
            }

            function load_file(fi) {
                var files = fi.files;
                if (files.length > 0) {
                    var file_data = files[0];
                    jsMind.util.file.read(file_data, function (freemind_data, jsmind_name) {
                        var mind = jsmind_data;
                        if (!!mind) {
                            _jm.show(mind);
                        } else {
                            console.error('can not open this file as mindmap');
                        }
                    });
                }
            }

            function save_nodetree() {
                var mind_data = _jm.get_data('node_tree');
                console.log(mind_data);
            }

            function replay() {
                var shell = _jm.shell;
                if (!!shell) {
                    shell.replay();
                }
            }

            // ----- History demo helpers (top-level) -----
            var snapA = null, snapB = null;
            function h_undo() {
                if (_jm && _jm.history) {
                    var ok = _jm.history.back();
                    console.log('undo', ok, 'index/len', _jm.history.index(), _jm.history.length());
                }
            }
            function h_redo() {
                if (_jm && _jm.history) {
                    var ok = _jm.history.forward();
                    console.log('redo', ok, 'index/len', _jm.history.index(), _jm.history.length());
                }
            }
            function h_add() {
                if (_jm && _jm.history) {
                    _jm.history.add('manual-click');
                    console.log('add snapshot, index/len', _jm.history.index(), _jm.history.length());
                }
            }
            function h_snapA() {
                if (_jm && _jm.history) { snapA = _jm.history.exportSnapshot(); console.log('Snapshot A set'); }
            }
            function h_snapB() {
                if (_jm && _jm.history) { snapB = _jm.history.exportSnapshot(); console.log('Snapshot B set'); }
            }
            function h_diff() {
                if (!snapA || !snapB) { alert('请先点击 Set A / Set B'); return; }
                var d = _jm.history.diff(snapA, snapB, { fields: ['id','topic','expanded','direction']});
                console.log('Diff A→B', d);
                alert('Diff: created=' + d.created.length + ', updated=' + d.updated.length + ', deleted=' + d.deleted.length + (d.truncated ? ' (truncated)' : ''));
            }
            function h_info() {
                if (_jm && _jm.history) {
                    var m = _jm.history.getStack();
                    console.log('Stack meta', m);
                    alert('index/length = ' + _jm.history.index() + '/' + _jm.history.length());
                }
            }


            load_jsmind();
        </script>
    </body>
</html>
